name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  FPC_VERSION: '3.2.2'

jobs:
  # ============================================================================
  # Minimal Gate (Linux) - fast + repeatable + aligns with local smoke commands
  # ============================================================================
  minimal-gate-linux:
    name: Minimal Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Free Pascal and OpenSSL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libssl-dev python3
          fpc -iV
          openssl version

      - name: Run minimal CI gate
        shell: bash
        run: |
          RUN_ID="gh_${GITHUB_RUN_ID:-0}_${GITHUB_RUN_ATTEMPT:-0}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          mkdir -p tmp/test-reports
          FAFAFA_MINIMAL_CI_GATE_RUN_ID="$RUN_ID" \
            bash scripts/run_minimal_ci_gate.sh --fast-local 2>&1 \
            | tee "tmp/test-reports/minimal_ci_gate_${RUN_ID}.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-gate-${{ env.RUN_ID }}
          path: tmp/test-reports/
          retention-days: 14

      - name: Append step summary
        if: always()
        shell: bash
        run: |
          echo "## Minimal CI Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- run_id: \`${RUN_ID:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if ls tmp/test-reports/test_report_*.txt >/dev/null 2>&1; then
            LATEST_REPORT="$(ls -t tmp/test-reports/test_report_*.txt | head -1)"
            echo "### Latest module test report (tail)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            tail -40 "$LATEST_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if ls tmp/test-reports/minimal_ci_gate_*.log >/dev/null 2>&1; then
            LATEST_LOG="$(ls -t tmp/test-reports/minimal_ci_gate_*.log | head -1)"
            echo "### Minimal gate log (tail)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            tail -60 "$LATEST_LOG" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # Code Quality Checks (Light) - keep it cheap and non-flaky
  # ============================================================================
  code-quality:
    name: Code Quality (Light)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for TODO/FIXME
        shell: bash
        run: |
          echo "=== Checking for TODO/FIXME markers (src/) ==="
          grep -rn "TODO\\|FIXME" src || true

      - name: Source statistics
        shell: bash
        run: |
          echo "=== Source code statistics ==="
          echo "Pascal source files: $(find src -name '*.pas' | wc -l)"
          echo "Test files: $(find tests -name '*.pas' | wc -l)"
