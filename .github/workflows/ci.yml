name: Linux OpenSSL CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: linux-openssl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-local-verified-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Free Pascal and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libssl-dev python3
          fpc -iV
          openssl version

      - name: Compile core Pascal modules
        run: |
          python3 scripts/compile_all_modules.py

      - name: Run fast-local smoke gate
        run: |
          bash scripts/run_minimal_ci_gate.sh --fast-local
