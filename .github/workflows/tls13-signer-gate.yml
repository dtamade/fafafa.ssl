name: TLS13 Signer Gate

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'src/fafafa.ssl.tls13.*.pas'
      - 'src/fafafa.ssl.freepascal.*.pas'
      - 'scripts/run_tls13_signer_gate_ci.sh'
      - 'scripts/run_tls13_signer_gate_bundle.sh'
      - 'scripts/generate_tls13_signer_gate_snapshot.sh'
      - 'scripts/export_tls13_signer_gate_status_json.sh'
      - 'scripts/run_wave_b_ci_gate.sh'
      - 'scripts/run_minimal_ci_gate.sh'
      - 'scripts/run_freepascal_tls13_servercertverify_bench.sh'
      - 'scripts/check_tls13_signer_pure_pascal.sh'
      - 'scripts/summarize_tls13_signer_bench_history.sh'
      - 'scripts/archive_ci_artifacts_draft.sh'
      - 'tests/test_tls13_servercertverify.pas'
      - '.github/workflows/tls13-signer-gate.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/fafafa.ssl.tls13.*.pas'
      - 'src/fafafa.ssl.freepascal.*.pas'
      - 'scripts/run_tls13_signer_gate_ci.sh'
      - 'scripts/run_tls13_signer_gate_bundle.sh'
      - 'scripts/generate_tls13_signer_gate_snapshot.sh'
      - 'scripts/export_tls13_signer_gate_status_json.sh'
      - 'scripts/run_wave_b_ci_gate.sh'
      - 'scripts/run_minimal_ci_gate.sh'
      - 'scripts/run_freepascal_tls13_servercertverify_bench.sh'
      - 'scripts/check_tls13_signer_pure_pascal.sh'
      - 'scripts/summarize_tls13_signer_bench_history.sh'
      - 'scripts/archive_ci_artifacts_draft.sh'
      - 'tests/test_tls13_servercertverify.pas'
      - '.github/workflows/tls13-signer-gate.yml'
  workflow_dispatch:
    inputs:
      bench_iterations:
        description: 'TLS13 signer bench iterations'
        required: false
        default: '2'
      bench_warmup:
        description: 'TLS13 signer bench warmup'
        required: false
        default: '1'
      bench_scheme:
        description: 'TLS13 signer bench scheme'
        required: false
        default: 'rsa_pkcs1_sha256'
      bench_timeout:
        description: 'TLS13 signer bench timeout (seconds)'
        required: false
        default: '180'

concurrency:
  group: tls13-signer-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls13-signer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libssl-dev python3 ripgrep
          fpc -iV
          openssl version

      - name: Run TLS13 signer gate bundle (ci + snapshot + status + archive)
        run: |
          BENCH_ITERATIONS="${{ github.event.inputs.bench_iterations }}"
          BENCH_WARMUP="${{ github.event.inputs.bench_warmup }}"
          BENCH_SCHEME="${{ github.event.inputs.bench_scheme }}"
          BENCH_TIMEOUT="${{ github.event.inputs.bench_timeout }}"

          BENCH_ITERATIONS="${BENCH_ITERATIONS:-2}"
          BENCH_WARMUP="${BENCH_WARMUP:-1}"
          BENCH_SCHEME="${BENCH_SCHEME:-rsa_pkcs1_sha256}"
          BENCH_TIMEOUT="${BENCH_TIMEOUT:-180}"

          RUN_ID="gh_${{ github.run_id }}_${{ github.run_attempt }}"

          FAFAFA_TLS13_SIGN_BENCH_ITERATIONS="${BENCH_ITERATIONS}" \
          FAFAFA_TLS13_SIGN_BENCH_WARMUP="${BENCH_WARMUP}" \
          FAFAFA_TLS13_SIGN_BENCH_SCHEME="${BENCH_SCHEME}" \
          FAFAFA_TLS13_SIGN_BENCH_TIMEOUT="${BENCH_TIMEOUT}" \
          FAFAFA_TLS13_SIGN_BENCH_HISTORY_LIMIT="10" \
          FAFAFA_TLS13_SIGNER_GATE_ARCHIVE="1" \
          FAFAFA_TLS13_SIGNER_GATE_ARCHIVE_PROFILE="pr" \
          FAFAFA_TLS13_SIGNER_GATE_ARCHIVE_ROOT="artifacts/ci" \
          bash scripts/run_tls13_signer_gate_bundle.sh --run-id "${RUN_ID}" --reports-dir test-reports --strict

      - name: Upload TLS13 signer artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tls13-signer-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-reports/tls13_signer_gate_bundle_*.md
            test-reports/tls13_signer_gate_snapshot_*.md
            test-reports/tls13_signer_gate_status_*.json
            test-reports/wave_b_ci_gate_summary_tls13_signer_*.md
            test-reports/wave_b_tls13_signer_*.json
            test-reports/tls13_signer_bench_history_*.md
            test-reports/wave_b_tls13_sign_purity_*.log
            test-reports/wave_b_tls13_sign_bench_*.log
            artifacts/ci/tls13_signer_gh_${{ github.run_id }}_${{ github.run_attempt }}
            artifacts/ci/tls13_signer_gh_${{ github.run_id }}_${{ github.run_attempt }}_pr_ci_artifacts.tar.gz
          retention-days: 14

      - name: Append step summary
        if: always()
        run: |
          echo "## TLS13 Signer Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          LATEST_BUNDLE=$(ls -1t test-reports/tls13_signer_gate_bundle_*.md 2>/dev/null | head -1 || true)
          LATEST_SNAPSHOT=$(ls -1t test-reports/tls13_signer_gate_snapshot_*.md 2>/dev/null | head -1 || true)
          LATEST_STATUS=$(ls -1t test-reports/tls13_signer_gate_status_*.json 2>/dev/null | head -1 || true)
          LATEST_BENCH_JSON=$(ls -1t test-reports/wave_b_tls13_signer_*.json 2>/dev/null | head -1 || true)

          if [[ -n "$LATEST_BUNDLE" ]]; then
            echo "- Bundle: \`$LATEST_BUNDLE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$LATEST_SNAPSHOT" ]]; then
            echo "- Snapshot: \`$LATEST_SNAPSHOT\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$LATEST_STATUS" ]]; then
            echo "- Status JSON: \`$LATEST_STATUS\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$LATEST_BENCH_JSON" ]]; then
            echo "- Bench JSON: \`$LATEST_BENCH_JSON\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -n "$LATEST_STATUS" ]]; then
            python3 - "$LATEST_STATUS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              d = json.load(f)

          bench = d.get('bench', {})

          print("")
          print("### Gate Status")
          print(f"- overall_state: `{d.get('overall_state', '')}`")
          print(f"- summary_overall: `{d.get('summary_overall', '')}`")
          print(f"- snapshot_state: `{d.get('snapshot_state', '')}`")
          print(f"- purity_status: `{d.get('purity_status', '')}`")
          print(f"- bench_status: `{d.get('bench_status', '')}`")
          print("")
          print("### Bench Metrics")
          print(f"- scheme: `{bench.get('scheme', '')}`")
          print(f"- iterations: `{bench.get('iterations', '')}`")
          print(f"- warmup: `{bench.get('warmup', '')}`")
          print(f"- CRT_avg_ms: `{bench.get('crt_avg_ms', '')}`")
          print(f"- D_avg_ms: `{bench.get('d_avg_ms', '')}`")
          print(f"- Speedup_D_over_CRT: `{bench.get('speedup_d_over_crt', '')}`")
          PY
          fi
